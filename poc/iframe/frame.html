<!DOCTYPE html>
<html>

<body>
  <h2>Iframe Content</h2>
  <table border='1' cellpadding='4' style='border-collapse:collapse;'>
    <tr>
      <th>URL</th>
      <td id='urlCell'>Waiting...</td>
    </tr>
    <tr>
      <th>Referrer</th>
      <td id='refCell'>Waiting...</td>
    </tr>
  </table>
  <script>
    window.addEventListener('message', function (e) {
      if (e.data && typeof e.data === 'object') {
        let parentUrl = e.data.url || '';
        let parentRef = e.data.referrer || '';

        document.getElementById('urlCell').textContent =  parentUrl;
        document.getElementById('refCell').textContent = parentRef;

        // history.replaceState({}, '', parentRef); // due to origin conflicts, cannot set URL to other domains
        history.replaceState({}, '', parentUrl);
        console.log(document.location.href);
        console.log(document.referrer);
      }
    });
  </script>
</body>

</html>

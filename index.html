          'https://www.googletagmanager.com/gtm.js?id=' + i + dl; f.parentNode.insertBefore(j, f);

  <title>Analytics Call Comparison Tool</title>

  <link rel="stylesheet" href="/style/styles.css">
  <script src="/script/tracker.js"></script>
  <script src="/script/call-compare.js" defer></script>
  <script src="/script/page-actions.js" defer></script>
</head>

<body>
    <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-WB28SLN5" height="0" width="0"
      style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->
   
  <main class="app">
    <header>
      <h1>Analytics Call Comparison Tool</h1>
      <p class="hint">Enter one or more calls (one per line) in the LEFT field and an equal number in the RIGHT field to compare.</p>
    </header>

    <form id="compare-form" class="compare-form">
      <div class="controls">
        <label class="small">Custom Delimiter
          <input type="text" id="custom-delimiter" name="custom-delimiter" maxlength="3" size="3" placeholder="," />
          <span class="info-icon" role="img" tabindex="0" aria-label="Custom delimiter info" data-tooltip="When specified, the custom delimiter is applied to a URL path. It does not replace the standard URL query string delimiter (&amp;).">ℹ</span>
        </label>
        <div class="legend">
          <strong>Legend</strong>
          <label><span class="legend-swatch exact"></span><input type="checkbox" data-legend="exact" checked> Exact</label>
          <label><span class="legend-swatch exists"></span><input type="checkbox" data-legend="exists" checked> Exists</label>
          <label><span class="legend-swatch left-only"></span><input type="checkbox" data-legend="left-only" checked> Left Only</label>
          <label><span class="legend-swatch right-only"></span><input type="checkbox" data-legend="right-only" checked> Right Only</label>
        </div>
      </div>

      <div class="textareas">
        <textarea id="left-calls" placeholder="** Required **&#10;&#10;Enter LEFT text for parsing and/or comparison"></textarea>
        <textarea id="right-calls" placeholder="** Optional **&#10;&#10;Enter RIGHT text for comparison (leave blank to compare left to itself)"></textarea>
      </div>

      <div class="actions">
        <a href="#" id="save-current" class="muted-link">Save</a>
        <button type="submit">Compare</button>
        <button type="reset" id="form-reset">Reset</button>
      </div>
      <div class="sub-links">
        <a href="#" id="compare-samples">Compare Sample URLs</a>
        <a href="#" id="download-csv" style="display:none">Download CSV</a>
        <a href="#" id="manage-saved" class="muted-link">Manage Saved</a>
      </div>
    </form>

    <section id="results" class="results" aria-live="polite"></section>

    <footer class="footer"></footer>
  </main>

  <!-- Saved comparisons modal -->
  <div id="saved-modal" class="modal" aria-hidden="true" role="dialog" aria-labelledby="saved-modal-title">
    <div class="modal-content">
      <header>
        <h2 id="saved-modal-title">Saved Comparisons</h2>
        <button id="saved-modal-close" class="modal-close" aria-label="Close">✕</button>
      </header>
      <div class="modal-body">
        <p class="modal-subtitle">Save up to 5 comparisons for later reference.</p>
        <form id="save-form">
          <div class="save-row">
            <label>Comparison Name:
              <input type="text" id="save-name" maxlength="60" placeholder="Enter a name for this comparison">
            </label>
            <div class="save-actions">
              <button type="button" id="save-confirm">Save</button>
              <button type="button" id="save-cancel">Cancel</button>
            </div>
          </div>
        </form>

        <hr />
        <div id="saved-list" class="saved-list" aria-live="polite"></div>
      </div>
    </div>
  </div>

 </body>
 
 </html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Z-Score to Confidence Level Calculator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    })(window, document, 'script', 'dataLayer', 'GTM-WB28SLN5');</script>

    <script type="text/javascript" src="../script/tracker.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f7f7f7; margin: 0; padding: 0; }
        .container { max-width: 400px; margin: 40px auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px #0001; padding: 24px; }
        h1 { font-size: 1.3em; margin-bottom: 1em; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 4px; font-weight: bold; }
        input[type="number"] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .side-selector-wrapper { margin-bottom: 16px; }
        .side-selector-wrapper label { font-weight: normal; margin-right: 16px; }
        .calculate-button-wrapper { text-align: right; margin-bottom: 16px; }
        button { padding: 8px 18px; background: #0073e6; color: #fff; border: none; border-radius: 4px; font-size: 1em; cursor: pointer; }
        button:hover { background: #005bb5; }
        .output-wrapper { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }
        output { min-width: 80px; display: inline-block; text-align: right; font-weight: bold; }
        small { color: #555; }
    </style>
</head>
<body>
<div class="container">
    <h1>Z-Score to Confidence Level</h1>
    <form id="zscore-form" autocomplete="off">
        <div class="form-group">
            <label for="zscore-input">Enter Z-Score:</label>
            <input id="zscore-input" name="a" type="number" min="-3.49" step="0.01" max="3.49" value="0"/>
            <small>(-3.50 to 3.50)</small>
        </div>

        <div class="side-selector-wrapper">
            <input class="form-check-input" type="radio" name="side" id="two-sided-radio" value="two-sided" checked>
            <label for="two-sided-radio">Two-Sided</label>
            <input class="form-check-input" type="radio" name="side" id="one-sided-radio" value="one-sided">
            <label for="one-sided-radio">One-Sided</label>
        </div>

        <div class="calculate-button-wrapper">
            <button id="zscore-calculate-button" type="submit">CALCULATE</button>
        </div>

        <div class="output-wrapper">
            <label for="zscore-output">Confidence Level:</label>
            <output id="zscore-output" value=".5000"></output>
        </div>
    </form>
</div>

<script>
    function zValue(z) {
        if (z < -3.5) return 0.0;
        if (z > 3.5) return 1.0;
        var factK = 1, sum = 0, term = 1, k = 0, loopStop = Math.exp(-23);
        while (Math.abs(term) > loopStop) {
            term = .3989422804 * Math.pow(-1, k) * Math.pow(z, k) / (2 * k + 1) / Math.pow(2, k) * Math.pow(z, k + 1) / factK;
            sum += term;
            k++;
            factK *= k;
        }
        sum += 0.5;
        return sum;
    }

    function zValueTwo(z) {
        if (z > 0) z = -z;
        if (z < -3.5) return 0.0;
        if (z > 3.5) return 1.0;
        var factK = 1, sum = 0, term = 1, k = 0, loopStop = Math.exp(-23);
        while (Math.abs(term) > loopStop) {
            term = .3989422804 * Math.pow(-1, k) * Math.pow(z, k) / (2 * k + 1) / Math.pow(2, k) * Math.pow(z, k + 1) / factK;
            sum += term;
            k++;
            factK *= k;
        }
        sum += 0.5;
        sum = sum * 2;
        sum = (sum * 100).toFixed(2);
        sum = 100 - sum;
        return sum;
    }

    document.addEventListener('DOMContentLoaded', function () {
        var form = document.getElementById('zscore-form');
        var zscoreInput = document.getElementById('zscore-input');
        var zscoreOutput = document.getElementById('zscore-output');

        form.addEventListener('submit', function(event) {
            event.preventDefault();
            var side = document.querySelector('input[name="side"]:checked').value;
            var zScoreInputValue = zscoreInput.value;
            var zScore = side === 'two-sided'
                ? zValueTwo(zScoreInputValue)
                : zValue(zScoreInputValue);

            if (zScore === 0 || zScore === 0.0){
                zscoreOutput.value = "0%";
                return;
            }

            if (zScore) {
                var outputValue = side === 'two-sided'
                    ? zScore
                    : zScore * 100;
                zscoreOutput.value = parseFloat(outputValue).toFixed(2) + " %";
            }
        });
    });
</script>
<div id="calculator-footer"></div>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    fetch('footer.html')
      .then(function(response) { return response.text(); })
      .then(function(html) {
        document.getElementById('calculator-footer').innerHTML = html;
      });
  });
</script>
</body>
</html>
